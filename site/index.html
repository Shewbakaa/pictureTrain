<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>For you</title>
  <style>
    /* Loading screen. Inline on purpose: it has to paint before any script or stylesheet arrives. */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(180deg, #f5bccd 0%, #f9d2c7 55%, #fde8d6 100%);
      color: #5b3342;
      font: 700 18px/1.3 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    #loading[hidden] { display: none; }

    .loading-scene { position: relative; width: 160px; height: 104px; }
    .loading-scene *, .loading-scene *::before, .loading-scene *::after { position: absolute; box-sizing: border-box; }
    .train { left: 0; bottom: 0; width: 160px; height: 62px; animation: chug 0.5s ease-in-out infinite; }
    .train .car { left: 8px; bottom: 11px; width: 52px; height: 32px; border-radius: 8px; background: #fffaf3; border-top: 6px solid #f08da5; }
    .train .car::before, .train .car::after { content: ''; top: 6px; width: 14px; height: 12px; border-radius: 4px; background: #bfe3f2; }
    .train .car::before { left: 7px; }
    .train .car::after { right: 7px; }
    .train .link { left: 60px; bottom: 21px; width: 8px; height: 4px; background: #5b3342; }
    .train .boiler { left: 66px; bottom: 11px; width: 66px; height: 28px; border-radius: 14px 8px 8px 14px; background: #e0607e; }
    .train .cab { left: 66px; bottom: 11px; width: 28px; height: 44px; border-radius: 6px 6px 3px 3px; background: #f08da5; }
    .train .cab::before { content: ''; left: -3px; top: -5px; width: 34px; height: 6px; border-radius: 4px; background: #5b3342; }
    .train .cab::after { content: ''; left: 7px; top: 9px; width: 14px; height: 13px; border-radius: 4px; background: #fffaf3; }
    .train .dome { left: 100px; bottom: 39px; width: 12px; height: 8px; border-radius: 6px 6px 0 0; background: #d9a441; }
    .train .chimney { left: 117px; bottom: 39px; width: 10px; height: 14px; border-radius: 2px 2px 0 0; background: #5b3342; }
    .train .chimney::before { content: ''; left: -2px; top: -3px; width: 14px; height: 4px; border-radius: 3px; background: #5b3342; }
    .train .lamp { left: 128px; bottom: 25px; width: 6px; height: 6px; border-radius: 50%; background: #ffe08a; }
    .train .wheel { bottom: 4px; width: 14px; height: 14px; border-radius: 50%; background: #5b3342; animation: spin 0.8s linear infinite; }
    .train .wheel::after { content: ''; left: 5px; top: 2px; width: 4px; height: 4px; border-radius: 50%; background: #fffaf3; }
    .train .w1 { left: 12px; } .train .w2 { left: 38px; } .train .w3 { left: 70px; } .train .w4 { left: 91px; } .train .w5 { left: 112px; }
    .track { left: -6px; right: -6px; bottom: 0; height: 4px; border-radius: 2px; background: #5b3342; }
    .ties { left: -6px; right: -6px; bottom: -8px; height: 5px; background: repeating-linear-gradient(90deg, #b07a88 0 6px, transparent 6px 16px); animation: ties 0.5s linear infinite; }

    .puff { left: 118px; bottom: 56px; width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.9); opacity: 0.7; animation: puff 1.8s ease-out infinite; }
    .puff.p2 { animation-delay: -0.6s; transform: translate(-9px, -13px) scale(0.85); }
    .puff.p3 { animation-delay: -1.2s; transform: translate(-18px, -27px) scale(1.1); }

    .heart { width: 14px; height: 14px; animation: float 3s ease-in-out infinite; }
    .heart i { inset: 0; background: #e0607e; transform: rotate(-45deg); }
    .heart i::before, .heart i::after { content: ''; width: 14px; height: 14px; border-radius: 50%; background: #e0607e; }
    .heart i::before { top: -7px; left: 0; }
    .heart i::after { top: 0; left: 7px; }
    .heart.h1 { left: 26px; bottom: 66px; animation-delay: -0.8s; }
    .heart.h2 { left: 134px; bottom: 60px; animation-delay: -2.2s; }
    .heart.h2 i, .heart.h2 i::before, .heart.h2 i::after { background: #f08da5; }

    .loading-text { margin: 0; }
    .loading-bar { width: min(60vw, 220px); height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.6); overflow: hidden; }
    #loading-progress { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f08da5, #e0607e); transition: width 0.3s ease; }

    @keyframes chug { 50% { transform: translateY(-2px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ties { to { background-position-x: -16px; } }
    @keyframes puff { 0% { opacity: 0; transform: translate(0, 0) scale(0.4); } 20% { opacity: 0.9; } 100% { opacity: 0; transform: translate(-22px, -34px) scale(1.2); } }
    @keyframes float { 0% { opacity: 0; transform: translateY(8px) scale(0.7); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px) scale(1); } }

    @media (prefers-reduced-motion: reduce) {
      #loading *, #loading *::before, #loading *::after { animation: none !important; transition: none !important; }
    }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="scene"></div>

  <div id="ui">
    <div id="loading">
      <div class="loading-scene" aria-hidden="true">
        <span class="heart h1"><i></i></span>
        <span class="heart h2"><i></i></span>
        <span class="puff p1"></span>
        <span class="puff p2"></span>
        <span class="puff p3"></span>
        <div class="train">
          <span class="car"></span>
          <span class="link"></span>
          <span class="boiler"></span>
          <span class="cab"></span>
          <span class="dome"></span>
          <span class="chimney"></span>
          <span class="lamp"></span>
          <span class="wheel w1"></span><span class="wheel w2"></span>
          <span class="wheel w3"></span><span class="wheel w4"></span><span class="wheel w5"></span>
        </div>
        <span class="track"></span>
        <span class="ties"></span>
      </div>
      <p class="loading-text">Getting the train ready…</p>
      <div class="loading-bar" aria-hidden="true"><div id="loading-progress"></div></div>
    </div>

    <div id="intro" class="card" hidden></div>
    <div id="stop-card" class="card" hidden></div>
    <div id="finale-card" class="card" hidden></div>

    <div id="topbar" hidden>
      <div id="progress-pill"></div>
      <button id="music-toggle" type="button"></button>
    </div>

    <div id="bottombar" hidden>
      <button id="pause-toggle" type="button"></button>
      <nav id="timeline"></nav>
    </div>

    <div id="fade" hidden></div>
    <div id="fallback" hidden></div>
    <div id="toast" hidden></div>
    <div id="stats" hidden></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
