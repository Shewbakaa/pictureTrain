# Puts the site/ folder on GitHub Pages when you press "Run workflow" on the Actions tab, and only then, so the
# placeholder version never goes online by accident. One-time setup: repo Settings > Pages > Build and deployment
# > Source: GitHub Actions. To publish on every push to main instead, add `push: branches: [main]` under `on:`
# (README section 7).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits its turn instead of cutting a running deployment short.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
